{% extends 'base.html' %}

<!-- Custom css -->
{% block style %}
<link rel="stylesheet" href="{{url_for('static', filename='css/dashboard.css')}}">
{% endblock %}

{% block content %}

<section class="dashboard-editor">

  <form method="POST" id="create-post-form" action="/create">


    <!-- Header-->
    <header class="dashboard-editor_header">


      <div class="dashboard-editor_add-title">

        <label for="title">Add title</label>

        <input type="text" name="title" id="title" placeholder="Titulo del post" value="{{request.form['title']}}"
          required>

      </div>

    </header>

    <!-- Dashboard' body -->
    <section class="dashboard-editor_body">
      <label>Add content</label>

      <div class="dashboard-editor_body-container">
        <header>
          <nav>
            <div class="write">
              <h3>Write</h3>
            </div>

            <div class="menu_opciones">
                <select name="section" id="miSelect" onchange="mostrarOpcionSeleccionada(this.value)">
                    <option value="">Seleccione una opción</option>
                    <option value="Technology">Technology</option>
                    <option value="Design">Design</option>
                    <option value="Programming">Programming</option>
                    <option value="Science">Science</option>
                    <option value="English">English</option>
                  </select>
            </div>

          
          </nav>
        </header>

        <div class="textarea">
          <textarea name="body" id="" cols="30" rows="10"></textarea>
        </div>
      </div>

      <!-- Para completar las flexbox -->
      <div class="btn-form"><div>
          <input class="btn btn-success" type="submit" value="save">
        </div>
        <div>
          <a class="btn btn-danger" href="/homepage">Cancelar</a>
        </div>

      </div>

    </section>




  </form>


  <!-- Select con opciones -->



  <script>
    // Función para mostrar la opción seleccionada
    function mostrarOpcionSeleccionada(valor) {
      const div = document.getElementById('opcionSeleccionada');
      div.innerText = 'Opción seleccionada: ${valor}';
    }
  </script>


</section>

{% endblock %}
