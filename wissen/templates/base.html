<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <!-- Reset style factory -->
        <link
            rel="stylesheet"
            href="{{url_for('static',filename='css/normalize.css')}}"
        />
        <link
            rel="stylesheet"
            href="{{url_for('static',filename='css/style.css')}}"
        />

        <!-- Requirement style -->
        <link
            rel="stylesheet"
            href="{{url_for('static',filename='css/var.css')}}"
        />
        <link
            rel="stylesheet"
            href="{{url_for('static',filename='css/carousel.css')}}"
        />

        <!-- Bootstrap -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />

        <!-- Custom Css-->
        {% block style %}
            <!-- ... -->
        {% endblock %}

        <title>{% block title %} Wissen | {% endblock %}</title>
    </head>

    <body>
        <!-- Content -->
        {% block content%}
            <!-- ... -->
        {% endblock %}

        <!-- Mensajes flasheados - Flashed Messages -->
        <section class="flashed-sms">
            {% for message in get_flashed_messages() %}
            <div class="flash alert alert-danger" role="alert" id="flashed-sms">
                <button type="button"
                    class="btn-close"
                    aria-label="Close"
                    onclick="flash_messages()"
                >
                </button>
                {{ message }}
            </div>
            {% endfor %}
        </section>

        <!-- Bootstrap scripts -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.7"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Auth Script-->
        <script src="{{url_for('static',filename='js/button.js')}}"></script>
        <script src="{{url_for('static',filename='js/eyePassword.js')}}"></script>
        <script src="{{url_for('static',filename='js/main.js')}}"></script>

        
        <!-- Custom Scripts -->
        {% block script %}
            <!-- ... -->
        {% endblock %}

    </body>
</html>
